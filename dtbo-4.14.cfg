# dtbo.img layout for msm-4.14 (kernel/google/msm-4.14-b1c1), used through
# BOARD_DTBO_CFG. Same board ids and revisions as msm-4.9's dtboimg.cfg:
# b1 = blueline (0x215), c1 = crosshatch (0x115), dvt1.1 = rev 2.
google/sdm845-b1-dvt1.1.dtbo
	id=0x215
	rev=0x2

google/sdm845-c1-dvt1.1.dtbo
	id=0x115
	rev=0x2
